[project]
name = "amc-tools"
version = "0.1.0"
description = "Herramientas de inspección técnica para AMC Solutions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "ruff>=0.15.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = ["raw"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.pyright]
include = ["."]
exclude = ["raw", ".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"
